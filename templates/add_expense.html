<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
</head>

<body>

<h1>Add Expense</h1>

<form action="/add-expense" method="POST">

    <label>Expense Name</label>
    <input
        type="text"
        name="expense_name"
        required
    >

    <br><br>

    <label>Amount</label>
    <input
        type="number"
        name="amount"
        required
    >

    <br><br>

    <button type="submit">
        Add Expense
    </button>

</form>

</body>
</html>
