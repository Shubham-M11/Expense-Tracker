<!DOCTYPE html>
<html>

<head>

    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Edit Expense</h1>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Expense Name

</label>

<input
type="text"
name="expense_name"
class="form-control"
value="{{ expense.expense }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Amount

</label>

<input
type="number"
name="amount"
class="form-control"
value="{{ expense.amount }}"
required>

</div>

<button class="btn btn-success">

Update Expense

</button>

<a href="/expenses" class="btn btn-secondary">

Back

</a>

</form>

</div>

</body>

</html>
